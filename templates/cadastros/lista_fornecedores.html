{% extends 'base.html' %}
{% block titulo_cabecalho %}Fornecedores{% endblock %}
{% block content %}
<div class="bg-white rounded-3xl shadow-sm border p-6">
    <div class="flex justify-between items-center mb-6">
        <form method="get" class="flex gap-2">
            <input type="text" name="q" placeholder="Buscar..." class="border-2 border-slate-200 p-3 rounded-xl focus:border-amber-500 outline-none text-sm w-64">
            <button type="submit" class="bg-slate-800 text-white px-4 rounded-xl"><i class="fa fa-search"></i></button>
        </form>
        <a href="{% url 'novo_fornecedor' %}" class="bg-amber-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-amber-600 transition">
            <i class="fa fa-plus mr-2"></i> NOVO FORNECEDOR
        </a>
    </div>
    <div class="space-y-2">
        {% for c in cadastros %}
        <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-100">
            <div>
                <p class="text-sm font-bold text-slate-700">{{ c.nome }}</p>
                <p class="text-[10px] text-slate-400">{% if c.cnpj %}CNPJ: {{ c.cnpj }}{% endif %}</p>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-slate-400 py-8">Nenhum fornecedor</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
