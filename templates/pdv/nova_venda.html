{% extends 'base.html' %}
{% block titulo_cabecalho %}PDV — Nova Venda{% endblock %}
{% block subtitulo_cabecalho %}Venda direta ao consumidor com pagamento na hora{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white rounded-3xl shadow-sm border p-8">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Cliente (opcional)</label>
                <input type="text" name="cliente" placeholder="Consumidor Final" class="w-full bg-white border-2 border-slate-200 p-3 rounded-xl focus:border-blue-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full py-4 bg-emerald-600 text-white font-black rounded-xl hover:bg-emerald-700 transition">
                <i class="fa fa-cash-register mr-2"></i> INICIAR VENDA
            </button>
        </form>
        <a href="{% url 'pdv:historico_vendas' %}" class="block text-center w-full mt-3 py-3 bg-slate-100 text-slate-600 text-sm font-bold rounded-xl hover:bg-slate-200 transition">
            <i class="fa fa-history mr-2"></i> HISTÓRICO DE VENDAS
        </a>
    </div>
</div>
{% endblock %}
