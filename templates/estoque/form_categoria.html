{% extends 'base.html' %}
{% block titulo_cabecalho %}{{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white rounded-3xl shadow-sm border p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">SALVAR</button>
                <a href="{% url 'estoque:lista_categorias' %}" class="flex-1 bg-slate-200 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-300 transition text-center">VOLTAR</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
