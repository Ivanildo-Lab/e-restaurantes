{% extends 'base.html' %}
{% block title %}e-Restaurantes - Acesso{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-12 w-full max-w-md text-center">
        <div class="bg-amber-500 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
            <i class="fa fa-utensils text-white text-3xl"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-800 mb-2">e-Restaurantes</h1>
        <p class="text-slate-500 mb-8">Sistema de Gestão para Bares e Restaurantes</p>
        {% if user.is_authenticated %}
            <a href="{% url 'restaurantes:mapa_mesas' %}" class="block w-full py-4 bg-amber-500 text-white font-black rounded-2xl hover:bg-amber-600 transition shadow-lg">
                <i class="fa fa-th-large mr-2"></i> ACESSAR MAPA DE MESAS
            </a>
        {% else %}
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Usuário" class="w-full border-2 border-slate-200 p-4 rounded-xl focus:border-amber-500 outline-none" required>
                <input type="password" name="password" placeholder="Senha" class="w-full border-2 border-slate-200 p-4 rounded-xl focus:border-amber-500 outline-none" required>
                <button type="submit" class="w-full py-4 bg-amber-500 text-white font-black rounded-2xl hover:bg-amber-600 transition shadow-lg">
                    <i class="fa fa-sign-in-alt mr-2"></i> ENTRAR
                </button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}
